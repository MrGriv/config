server:
  port: 8081

spring:
  kafka:
    bootstrap-servers: kafka:9092
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://db:5432/users
    username: user
    password: user
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka
